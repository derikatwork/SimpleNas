name: Build installer ISO

# Produces a downloadable SimpleNAS installer ISO.
#  - Every push to main (and manual runs) upload the ISO as a workflow ARTIFACT
#    (Actions run -> Artifacts -> simplenas-installer-iso).
#  - Pushing a tag like v1.0 additionally publishes a GitHub RELEASE with the
#    ISO attached, giving a stable download link.
#
# Third-party actions are pinned to commit SHAs (supply-chain hardening); the
# trailing comment is the human-readable version they correspond to.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

# Avoid piling up concurrent ISO builds.
concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; only the release job elevates to write.
permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ISO builds need lots of disk; free up the runner first.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Nix (flakes enabled)
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build the ISO
        run: nix build .#iso -L

      - name: Collect the ISO
        run: |
          mkdir -p out
          cp -L result/iso/*.iso out/
          ls -lh out

      - name: Upload ISO artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: simplenas-installer-iso
          path: out/*.iso
          if-no-files-found: error
          retention-days: 90

  release:
    # Publish a GitHub Release with the ISO, only for tag builds.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-iso
    runs-on: ubuntu-latest
    permissions:
      contents: write   # scoped to just this job
    steps:
      - name: Download ISO artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: simplenas-installer-iso
          path: out

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: out/*.iso
          generate_release_notes: true
