name: Update flake.lock

# Generates and commits flake.lock, which pins the exact nixpkgs revision so
# builds are reproducible. Run it once from the Actions tab (Run workflow) on the
# branch you want pinned; re-run any time to refresh the pin. It commits only if
# flake.lock actually changed.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Nix (flakes enabled)
        uses: cachix/install-nix-action@08dcb3a5e62fa31e2da3d490afc4176ef55ecd72 # v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Generate flake.lock
        run: nix flake lock

      - name: Commit flake.lock if changed
        run: |
          if git diff --quiet -- flake.lock 2>/dev/null && git ls-files --error-unmatch flake.lock >/dev/null 2>&1; then
            echo "flake.lock already tracked and unchanged."
            exit 0
          fi
          if [ -z "$(git status --porcelain -- flake.lock)" ]; then
            echo "No flake.lock change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "Add/update flake.lock to pin nixpkgs

          Generated by the Update flake.lock workflow for reproducible builds."
          git push
